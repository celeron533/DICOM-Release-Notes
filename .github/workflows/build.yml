name: Build and Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "15 10 * * *" # every day at 10:15

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Downloaded Files
        uses: actions/cache@v4
        with:
          path: downloaded/
          key: ${{ runner.os }}-custom

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"

      - run: poetry install --no-root

      - name: Run data generation script
        run: poetry run python src/dicom-release-notes/start.py

      - name: copy files to publish directory
        run: |
          mkdir -p publish/data
          cp data/consolidated.json publish/data/
          cp data/consolidated_info.json publish/data/
          cp index.html publish/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add origin https://${{ secrets.PUSH_TOKEN }}@github.com/${{ github.repository }}.git
      - name: compare the downloaded folder and commit if necessary
        run: |
          git add downloaded/
          git diff --cached --quiet || git commit -m "Update downloaded files"
          git push origin master

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

